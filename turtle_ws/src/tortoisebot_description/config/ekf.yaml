ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map   # FIXED

    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]   # FIXED vx + yaw-rate

    imu0: /imu    # FIXED (correct topic)
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]  # FIXED yaw-rate fusion
    imu0_remove_gravitational_acceleration: true
