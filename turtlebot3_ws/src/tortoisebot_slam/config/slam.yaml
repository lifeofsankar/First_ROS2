slam_toolbox:
  ros__parameters:
    use_sim_time: true

    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    scan_topic: "/scan"

    mode: "async"   # FIXED

    transform_timeout: 1.0
    tf_buffer_duration: 30.0

    resolution: 0.05
    map_update_interval: 2.0

    minimum_time_interval: 0.0   # FIXED
